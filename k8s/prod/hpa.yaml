apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cre8-web-hpa
  namespace: prod
  labels:
    app: cre8-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cre8-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
